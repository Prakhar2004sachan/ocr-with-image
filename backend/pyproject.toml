[project]
name = "unlimited-ocr-backend"
version = "1.0.0"
description = "Private cross-platform backend for Baidu Unlimited-OCR"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "httpx>=0.28",
  "pymupdf>=1.25",
  "pillow>=11.0",
  "pillow-heif>=1.0",
  "psutil>=6.0",
  "python-multipart>=0.0.20",
  "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.8", "playwright>=1.49"]
# Needed only for the original Unlimited-OCR-2 Safetensors engine.
inference = [
  "torch>=2.4",
  "transformers>=4.46",
  "accelerate>=1.0",
  "einops>=0.8",
  "addict>=2.4",
  "easydict>=1.13",
]
download = ["huggingface_hub>=0.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
  "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# FastAPI uses File(...) in signatures, and the engine deliberately swallows
# cleanup/probe errors so a dead engine never crashes the API.
ignore = ["B008", "BLE001", "S110", "EXE001"]
