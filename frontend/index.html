<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Unlimited OCR Studio — private, layout-aware document parsing on your own machine, powered by Baidu Unlimited-OCR."
    />
    <meta name="theme-color" content="#17140f" />
    <script>
      try {
        var stored = localStorage.getItem('unlimited-ocr.theme')
        if (
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (_) {}
    </script>
    <title>Unlimited OCR Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
